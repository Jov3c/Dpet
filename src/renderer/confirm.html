<!doctype html>
<html lang="zh-CN">
  <head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>投喂确认</title><link rel="stylesheet" href="confirm.css" /></head>
  <body>
    <main class="confirm-window">
      <header><span><i></i>ROACH / FEED</span><button id="close" type="button" aria-label="关闭">×</button></header>
      <section class="content">
        <div class="title-row"><div><p class="eyebrow">投喂确认</p><h1>交给它处理？</h1></div><span id="confirm-count" class="count"></span></div>
        <p class="description">文件将移入应用回收站，之后仍可在设置中恢复。</p>
        <ul id="confirm-list"></ul>
        <div class="actions"><button id="cancel" type="button">取消</button><button id="confirm" type="button">投喂</button></div>
      </section>
    </main>
    <script type="module" src="confirm.js"></script>
  </body>
</html>
