<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Roach on Desk · 设置</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="settings-window">
      <div class="settings-layout">
        <nav class="settings-sidebar">
          <div class="sidebar-brand">ROACH</div>
          <button class="sidebar-item is-active" type="button" data-pane="behavior">行为</button>
          <button class="sidebar-item" type="button" data-pane="system">系统</button>
          <button class="sidebar-item" type="button" data-pane="recycle">回收站</button>
          <button class="sidebar-item" type="button" data-pane="about">关于</button>
          <div class="sidebar-footer">v0.1.1</div>
        </nav>
        <div class="settings-main">
          <header class="settings-bar">
            <span class="settings-title" id="settings-title">行为</span>
            <button id="close-settings" type="button" aria-label="关闭设置">✕</button>
          </header>
          <div class="settings-content">
            <div class="pane is-active" data-pane="behavior">
              <label class="toggle-row"><span>自动游走</span><input id="auto-walk" type="checkbox" /></label>
              <label class="toggle-row"><span>可拖拽抓住</span><input id="draggable" type="checkbox" /></label>
              <label class="toggle-row"><span>鼠标靠近时逃跑</span><input id="avoid-mouse" type="checkbox" /></label>
              <label class="toggle-row"><span>连点挣扎</span><input id="tease" type="checkbox" /></label>
              <label class="toggle-row"><span>拖到边缘收边</span><input id="edge-tuck" type="checkbox" /></label>
            </div>
            <div class="pane" data-pane="system">
              <label class="toggle-row"><span>始终置顶显示</span><input id="always-on-top" type="checkbox" /></label>
              <label class="toggle-row"><span>跟随本机系统事件</span><input id="system-events" type="checkbox" /></label>
              <p class="hint">关闭「始终置顶」后，蟑螂只在桌面显示，可被其他窗口挡住。</p>
              <div class="info-row"><span>角色尺寸</span><span class="info-value">95 × 161 px</span></div>
            </div>
            <div class="pane" data-pane="recycle">
              <div class="recycle-header">
                <span class="section-label">已回收</span>
                <button id="empty-recycle" class="btn-small" type="button">清空</button>
              </div>
              <div id="recycle-list" class="recycle-list"></div>
              <p id="recycle-empty-hint" class="hint">回收站是空的。拖拽文件或文件夹给蟑螂，它就会帮你收起来。</p>
            </div>
            <div class="pane" data-pane="about">
              <p class="about-name">Roach on Desk</p>
              <p class="about-desc">离线写实蟑螂桌宠 · v0.1.1</p>
              <p class="hint">拖动可抓住它；连点会挣扎逃跑。<br />拖到屏幕边缘松手，它会藏起来只露触须。<br />Ctrl + Shift + H 隐藏<br />Ctrl + Shift + R 重新显示</p>
            </div>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="settings.js"></script>
  </body>
</html>
