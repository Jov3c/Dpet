<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Roach on Desk</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main id="pet-shell" aria-label="桌面蟑螂宠物">
      <img id="pet" draggable="false" alt="写实俯视蟑螂桌宠" />
      <section id="confirm-dialog" hidden aria-label="确认回收">
        <div class="dialog-card">
          <h2>让蟑螂吃掉这些？</h2>
          <p id="confirm-count" class="dialog-count"></p>
          <ul id="confirm-list" class="dialog-list"></ul>
          <div class="dialog-actions">
            <button id="confirm-cancel" type="button">取消</button>
            <button id="confirm-ok" type="button">吃掉</button>
          </div>
        </div>
      </section>
    </main>
    <script type="module" src="app.js"></script>
  </body>
</html>
